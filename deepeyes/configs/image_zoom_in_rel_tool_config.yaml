tools:
  - class_name: "recipe.deepeyes.tools.image_zoom_in_tool_rel.ImageZoomInToolRelative"
    config:
      rate_limit: 256
      timeout: 60
      type: native
    tool_schema:
      type: "function"
      function:
        name: "image_zoom_in_rel_tool"
        description: "Zoom in on a specific region of an image by cropping it based on a bounding box (bbox) with coordinates normalized to 0-1000, and an optional object label."
        parameters:
          type: "object"
          properties:
            bbox_2d:
              type: "array"
              items:
                type: "number"
              minItems: 4
              maxItems: 4
              description: "Bounding box coordinates [x1, y1, x2, y2] in the normalized 0-1000 coordinate system, where (x1, y1) is the top-left corner and (x2, y2) is the bottom-right corner."
            label:
              type: "string"
              description: "The name or label of the object inside the bounding box (optional)."
          required: ["bbox_2d"]
